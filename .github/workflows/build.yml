name: Build and Release Cygwin-based Wheel

on:
  schedule:
    # 每天 UTC 时间凌晨 0 点执行（注意：GitHub 使用的是 UTC 时间）
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build pyinstaller requests py7zr


      - name: Create cygwin directory
        run: |
          mkdir -p cygwinpack\cygwin

      - name: Download Cygwin setup
        run: |
          curl -L https://cygwin.com/setup-x86_64.exe -o cygwinpack\cygwin\cygwin.exe

      - name: Install Cygwin packages silently
        run: |
          cmd /c for /f "usebackq delims=" %%i in ("package.txt") do start /wait .\cygwinpack\cygwin\cygwin.exe --quiet-mode --download --local-package-dir "%cd%\cygwinpack\cygwin" --site "https://mirror.cpsc.ucalgary.ca/mirror/cygwin.com/" --packages "%%i" --wait
        shell: cmd
      - name: Copy package list
        run: |
          copy .\package.txt cygwinpack\postinstall\
        shell: cmd
      - name: Build wheel
        run: |
          python -m build --wheel --config-setting="--build-option=--plat-name=win_amd64"

      - name: Get current date as tag
        id: date
        run: |
          for /f "tokens=2-4 delims=/ " %%a in ('date /t') do echo TAG=%%c%%a%%b>>%GITHUB_ENV%
        shell: cmd
      - name: Download sfx head and 7zr
        run: |
          curl -L https://github.com/xumouren225588/res/raw/refs/heads/main/7zSD.sfx -o 7.sfx
          curl -L https://www.7-zip.org/a/7zr.exe -o 7.exe
      - name: build pyinstaller and pack
        run: |
          pyinstaller -F cygupdate.py
          copy dist\cygupdate.exe cygwinpack\postinstall\update-cygwin.exe
          cd cygwinpack
          pyinstaller -F -w install.py
          copy dist\install.exe .\install.exe
          rd /s /q dist
          ..\7.exe a ..\dist\cygwinpack_${{ env.TAG }}_amd64.7z postinstall cygwin install.bat install.exe
          cd ..
          copy /b 7.sfx + config.txt + dist\cygwinpack_${{ env.TAG }}_amd64.7z dist\cygwinpack_${{ env.TAG }}_amd64.exe
        shell: cmd
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pip index HTML
        run: |
          python scripts/index.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pip_index
          publish_branch: gh-pages
